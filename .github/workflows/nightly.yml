name: Build nightly installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  package:
    name: Package ${{ matrix.id }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-2025
            platform: win32
            arch: x64
            macos: false
            rpm: false
            wix: true
          - id: linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            macos: false
            rpm: true
            wix: false
          - id: macos-x64
            os: macos-15-intel
            platform: darwin
            arch: x64
            macos: true
            rpm: false
            wix: false
          - id: macos-arm64
            os: macos-15-intel
            platform: darwin
            arch: arm64
            macos: true
            rpm: false
            wix: false

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set Electron cache path
        shell: bash
        run: |
          # runner.temp is available in steps, but not at job-definition time.
          echo "electron_config_cache=${RUNNER_TEMP}/electron-cache" >> "$GITHUB_ENV"
          echo "WH_NOTES_ELECTRON_CACHE=${RUNNER_TEMP}/electron-cache" >> "$GITHUB_ENV"

      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install Linux packaging tools
        if: matrix.rpm
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm fakeroot

      - name: Install WiX Toolset
        if: matrix.wix
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem -Path "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName "bin" } |
            Where-Object { (Test-Path "$_\candle.exe") -and (Test-Path "$_\light.exe") } |
            Select-Object -First 1
          if (-not $wixBin) {
            choco install wixtoolset --yes --no-progress
            $wixBin = Get-ChildItem -Path "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object { (Test-Path "$_\candle.exe") -and (Test-Path "$_\light.exe") } |
              Select-Object -First 1
          }
          if (-not (Test-Path "$wixBin\candle.exe") -or -not (Test-Path "$wixBin\light.exe")) {
            throw "WiX Toolset installation is incomplete."
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Set a unique nightly package version
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.0-nightly${GITHUB_RUN_NUMBER}"
          echo "WH_NOTES_NIGHTLY_VERSION=$version" >> "$GITHUB_ENV"
          WH_NOTES_NIGHTLY_VERSION="$version" node scripts/set-build-version.mjs "$version"

      - name: Build Windows and Linux installers
        if: ${{ !matrix.macos }}
        run: npm run make -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Build and ad-hoc sign macOS archives
        if: matrix.macos
        shell: bash
        run: |
          set -euo pipefail
          npm run package -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
          app_path="out/wh_notes-darwin-${{ matrix.arch }}/wh_notes.app"
          test -d "$app_path"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          npm run make -- --skip-package --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Verify the Windows MSI is per-user and has no updater
        if: matrix.wix
        shell: pwsh
        run: |
          $msiFiles = @(Get-ChildItem -Path out\make -Recurse -File -Filter *.msi)
          if ($msiFiles.Count -ne 1) {
            throw "Expected exactly one MSI installer, found $($msiFiles.Count)."
          }
          $wxsFiles = @(Get-ChildItem -Path out\make -Recurse -File -Filter *.wxs)
          if ($wxsFiles.Count -ne 1) {
            throw "Expected exactly one generated WiX source file, found $($wxsFiles.Count)."
          }
          $wxs = Get-Content -Raw $wxsFiles[0].FullName
          foreach ($expected in @(
            '<Directory Id="LocalAppDataFolder">',
            'InstallScope="perUser"',
            'Id="MSIINSTALLPERUSER" Secure="yes" Value="1"'
          )) {
            if (-not $wxs.Contains($expected)) {
              throw "Windows installer is not configured as a per-user install: missing $expected"
            }
          }
          $legacyArtifacts = @(Get-ChildItem -Path out\make -Recurse -File | Where-Object {
            $_.Name -eq "Update.exe" -or $_.Name -eq "RELEASES" -or $_.Extension -eq ".nupkg"
          })
          if ($legacyArtifacts.Count -gt 0) {
            throw "Squirrel update artifacts must not be included: $($legacyArtifacts.FullName -join ', ')"
          }

      - name: Verify macOS archives have no update manifest
        if: matrix.macos
        shell: bash
        run: |
          set -euo pipefail
          dmg_file="$(find out/make -type f -name '*.dmg' -print -quit)"
          zip_file="$(find out/make -type f -name '*.zip' -print -quit)"
          test "$(find out/make -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          test "$(find out/make -type f -name '*.zip' | wc -l | tr -d ' ')" -eq 1
          [[ "$dmg_file" == *-${{ matrix.arch }}.dmg ]]
          [[ "$zip_file" == *-${{ matrix.arch }}-*.zip ]]
          app_path="out/wh_notes-darwin-${{ matrix.arch }}/wh_notes.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path" 2>&1 | grep -q 'Signature=adhoc'
          if find out/make -type f -name 'RELEASES.json' -print -quit | grep -q .; then
            echo "macOS update manifests must not be created."
            exit 1
          fi

      - name: Upload installer files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-${{ matrix.id }}
          path: |
            out/make/**/*.msi
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish nightly pre-release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download installer files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Prepare checksums and release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="nightly-$(date -u +'%Y%m%d.%H%M')-${GITHUB_SHA::7}"
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=wh_notes nightly — ${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0)
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Automatyczny, niesygnowany build z gałęzi main. Commit: $GITHUB_SHA" \
            --prerelease

      - name: Attest public release assets
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/**
